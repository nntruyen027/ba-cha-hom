
<HTML>
<HEAD>
    <TITLE> New Document </TITLE>
    <META NAME="Generator" CONTENT="EditPlus">
    <META NAME="Author" CONTENT="">
    <META NAME="Keywords" CONTENT="">
    <META NAME="Description" CONTENT="">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }
        #heart { z-index: 1; }
        #fx { z-index: 2; pointer-events: none; }
        .title {
            position: absolute;
            left: 0;
            right: 0;
            z-index: 3;
            text-align: center;
            white-space: nowrap;
            pointer-events: none;
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
        }
        #top { top: max(3vh, env(safe-area-inset-top)); font-size: clamp(22px, min(10vw, 9vh), 96px); }
        #bottom { bottom: max(3vh, env(safe-area-inset-bottom)); font-size: clamp(20px, min(9.5vw, 8.5vh), 90px); }
        @media (max-height: 450px) and (orientation: landscape) {
            #top { top: 1vh; }
            #bottom { bottom: 1vh; }
        }
        .title span {
            display: inline-block;
            opacity: 0;
            background: linear-gradient(90deg, #ff4d6d, #ffb3c6, #ffd166, #ff8fab, #ff4d6d);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 77, 109, .85));
            animation: pop .8s ease-out forwards, shine 4s linear infinite, wave 2.4s ease-in-out infinite;
        }
        @keyframes pop {
            0% { opacity: 0; transform: translateY(-40px) scale(.3) rotate(-20deg); }
            70% { opacity: 1; transform: translateY(6px) scale(1.2); }
            100% { opacity: 1; transform: none; }
        }
        @keyframes shine { to { background-position: 300% 0; } }
        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</HEAD>

<BODY style=" background-color: #000;">

<canvas id="heart"></canvas>
<canvas id="fx"></canvas>
<div id="top" class="title" data-text="Chúc Bà Chã Hơm"></div>
<div id="bottom" class="title" data-text="20/11 Hạnh Phúc Bên Ăm Chã Húi Nhé!!!"></div>

<script>
    window.requestAnimationFrame =
            window.__requestAnimationFrame ||
            window.requestAnimationFrame ||
            window.webkitRequestAnimationFrame ||
            window.mozRequestAnimationFrame ||
            window.oRequestAnimationFrame ||
            window.msRequestAnimationFrame ||
            (function () {
                return function (callback, element) {
                    var lastTime = element.__lastTime;
                    if (lastTime === undefined) {
                        lastTime = 0;
                    }
                    var currTime = Date.now();
                    var timeToCall = Math.max(1, 33 - (currTime - lastTime));
                    window.setTimeout(callback, timeToCall);
                    element.__lastTime = currTime + timeToCall;
                };
            })();
    window.isDevice = (/android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(((navigator.userAgent || navigator.vendor || window.opera)).toLowerCase()));
    var loaded = false;
    var init = function () {
        if (loaded) return;
        loaded = true;
        var mobile = window.isDevice || Math.min(innerWidth, innerHeight) < 600 || matchMedia('(pointer: coarse)').matches;
        var koef = mobile ? 0.5 : 1;
        var canvas = document.getElementById('heart');
        var ctx = canvas.getContext('2d');
        var width = canvas.width = koef * innerWidth;
        var height = canvas.height = koef * innerHeight;
        var rand = Math.random;
        ctx.fillStyle = "rgba(0,0,0,1)";
        ctx.fillRect(0, 0, width, height);


        var heartPosition = function (rad) {
            //return [Math.sin(rad), Math.cos(rad)];
            return [Math.pow(Math.sin(rad), 3), -(15 * Math.cos(rad) - 5 * Math.cos(2 * rad) - 2 * Math.cos(3 * rad) - Math.cos(4 * rad))];
        };
        var scaleAndTranslate = function (pos, sx, sy, dx, dy) {
            return [dx + pos[0] * sx, dy + pos[1] * sy];
        };

        window.addEventListener('resize', function () {
            width = canvas.width = koef * innerWidth;
            height = canvas.height = koef * innerHeight;
            ctx.fillStyle = "rgba(0,0,0,1)";
            ctx.fillRect(0, 0, width, height);
            buildPoints();
            resizeFx();
        });

        var traceCount = mobile ? 20 : 50;
        var pointsOrigin = [];
        var i;
        var dr = mobile ? 0.3 : 0.1;
        var layers = [[210, 13], [180, 11], [150, 9], [120, 7], [90, 5]];
        var heartScale = 1;
        var buildPoints = function () {
            // base heart is ~420x400px at scale 1; leave room for the text above/below
            var portrait = height > width;
            var s = heartScale = Math.min(width * (portrait ? 0.92 : 0.85) / 420, height * (portrait ? 0.6 : 0.64) / 400);
            pointsOrigin.length = 0;
            layers.forEach(function (l) {
                for (var a = 0; a < Math.PI * 2; a += dr) pointsOrigin.push(scaleAndTranslate(heartPosition(a), l[0] * s, l[1] * s, 0, 0));
            });
        };
        buildPoints();
        var heartPointsCount = pointsOrigin.length;

        var targetPoints = [];
        var pulse = function (kx, ky) {
            for (i = 0; i < pointsOrigin.length; i++) {
                targetPoints[i] = [];
                targetPoints[i][0] = kx * pointsOrigin[i][0] + width / 2;
                // heart curve is bottom-heavy (~-12..19 units), shift up to center it
                targetPoints[i][1] = ky * (pointsOrigin[i][1] - 45 * heartScale) + height / 2;
            }
        };

        var e = [];
        for (i = 0; i < heartPointsCount; i++) {
            var x = rand() * width;
            var y = rand() * height;
            e[i] = {
                vx: 0,
                vy: 0,
                R: 2,
                speed: rand() + 5,
                q: ~~(rand() * heartPointsCount),
                D: 2 * (i % 2) - 1,
                force: 0.2 * rand() + 0.7,
                f: "hsla(0," + ~~(40 * rand() + 60) + "%," + ~~(60 * rand() + 20) + "%,.3)",
                trace: []
            };
            for (var k = 0; k < traceCount; k++) e[i].trace[k] = {x: x, y: y};
        }

        var config = {
            traceK: 0.4,
            timeDelta: 0.01
        };

        var fx = document.getElementById('fx');
        var fctx = fx.getContext('2d');
        var fw, fh, fs;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var resizeFx = function () {
            fw = innerWidth;
            fh = innerHeight;
            fx.width = fw * dpr;
            fx.height = fh * dpr;
            fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            fs = Math.max(0.6, Math.min(1.4, Math.min(fw, fh) / 700));
        };
        resizeFx();
        var colors = ['#ff4d6d', '#ff8fab', '#ffb3c6', '#ffd166', '#ff006e'];
        var pick = function (a) { return a[~~(rand() * a.length)]; };
        var stars = [];
        for (i = 0; i < (mobile ? 60 : 140); i++) stars.push({x: rand(), y: rand(), r: rand() * 1.4 + 0.3, p: rand() * 6.28, s: rand() * 2 + 0.5});
        var floaters = [], petals = [], bursts = [], shooting = null;

        var drawHeart = function (x, y, size, color, alpha, rot) {
            fctx.save();
            fctx.translate(x, y);
            fctx.rotate(rot);
            fctx.scale(size / 16, size / 16);
            fctx.globalAlpha = Math.max(0, alpha);
            fctx.fillStyle = color;
            fctx.shadowColor = color;
            fctx.shadowBlur = 12;
            fctx.beginPath();
            fctx.moveTo(0, 6);
            fctx.bezierCurveTo(-10, -2, -6, -12, 0, -5);
            fctx.bezierCurveTo(6, -12, 10, -2, 0, 6);
            fctx.fill();
            fctx.restore();
        };

        var burst = function (x, y) {
            for (var j = 0; j < 24; j++) {
                var a = j / 24 * Math.PI * 2, sp = (2 + rand() * 4) * fs;
                bursts.push({x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size: (6 + rand() * 10) * fs, c: pick(colors), life: 1, rot: rand() * 6.28});
            }
        };
        window.addEventListener('pointerdown', function (ev) { burst(ev.clientX, ev.clientY); });
        setInterval(function () {
            if (fh > fw) burst(fw * (0.2 + rand() * 0.6), fh * (rand() < 0.5 ? 0.2 : 0.8));
            else burst(fw * (rand() < 0.5 ? 0.12 + rand() * 0.15 : 0.73 + rand() * 0.15), fh * (0.25 + rand() * 0.5));
        }, 2500);

        var drawFx = function () {
            var t = performance.now() / 1000;
            var j, p;
            fctx.clearRect(0, 0, fw, fh);

            fctx.fillStyle = '#fff';
            for (j = 0; j < stars.length; j++) {
                p = stars[j];
                fctx.globalAlpha = 0.25 + 0.75 * Math.abs(Math.sin(t * p.s + p.p));
                fctx.beginPath();
                fctx.arc(p.x * fw, p.y * fh, p.r, 0, 6.28);
                fctx.fill();
            }
            fctx.globalAlpha = 1;

            if (!shooting && rand() < 0.004) shooting = {x: fw * (0.4 + rand() * 0.6), y: rand() * fh * 0.3, vx: -9, vy: 4.5, life: 1};
            if (shooting) {
                var g = fctx.createLinearGradient(shooting.x, shooting.y, shooting.x - shooting.vx * 14, shooting.y - shooting.vy * 14);
                g.addColorStop(0, 'rgba(255,255,255,' + shooting.life + ')');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                fctx.strokeStyle = g;
                fctx.lineWidth = 2;
                fctx.beginPath();
                fctx.moveTo(shooting.x, shooting.y);
                fctx.lineTo(shooting.x - shooting.vx * 14, shooting.y - shooting.vy * 14);
                fctx.stroke();
                shooting.x += shooting.vx;
                shooting.y += shooting.vy;
                shooting.life -= 0.015;
                if (shooting.life <= 0) shooting = null;
            }

            if (rand() < (mobile ? 0.03 : 0.06)) floaters.push({x: rand() * fw, y: fh + 20, size: (8 + rand() * 18) * fs, vy: (0.5 + rand()) * fs, sway: rand() * 6.28, c: pick(colors)});
            for (j = floaters.length; j--;) {
                p = floaters[j];
                p.y -= p.vy;
                drawHeart(p.x + Math.sin(t * 1.5 + p.sway) * 20 * fs, p.y, p.size, p.c, Math.min(0.8, p.y / fh), Math.sin(t + p.sway) * 0.3);
                if (p.y < -30) floaters.splice(j, 1);
            }

            if (rand() < (mobile ? 0.03 : 0.05)) petals.push({x: rand() * fw, y: -20, vx: rand() - 0.5, vy: 0.6 + rand(), rot: rand() * 6.28, vr: (rand() - 0.5) * 0.06, size: (5 + rand() * 6) * fs, c: rand() < 0.5 ? '#ffc2d1' : '#ffe5ec'});
            for (j = petals.length; j--;) {
                p = petals[j];
                p.x += p.vx + Math.sin(t + j) * 0.5;
                p.y += p.vy;
                p.rot += p.vr;
                fctx.save();
                fctx.translate(p.x, p.y);
                fctx.rotate(p.rot);
                fctx.globalAlpha = 0.85;
                fctx.fillStyle = p.c;
                fctx.beginPath();
                fctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, 6.28);
                fctx.fill();
                fctx.restore();
                if (p.y > fh + 20) petals.splice(j, 1);
            }

            for (j = bursts.length; j--;) {
                p = bursts[j];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.98;
                p.vy = p.vy * 0.98 + 0.06;
                p.life -= 0.012;
                drawHeart(p.x, p.y, p.size, p.c, p.life, p.rot);
                if (p.life <= 0) bursts.splice(j, 1);
            }
        };

        var time = 0;
        var textLeft1 = 0;
        var textLeft2 = -10;
        var loop = function () {
            var mLeft = 50;
            var mTop = 250;
            var n = -Math.cos(time);
            pulse((1 + n) * .5, (1 + n) * .5);
            time += ((Math.sin(time)) < 0 ? 9 : (n > 0.8) ? .2 : 1) * config.timeDelta;
            ctx.fillStyle = "rgba(0,0,0,.1)";
            ctx.fillRect(0, 0, width, height);
            for (i = e.length; i--;) {
                var u = e[i];
                var q = targetPoints[u.q];
                var dx = u.trace[0].x - q[0];
                var dy = u.trace[0].y - q[1];
                var length = Math.sqrt(dx * dx + dy * dy);
                if (10 > length) {
                    if (0.95 < rand()) {
                        u.q = ~~(rand() * heartPointsCount);
                    }
                    else {
                        if (0.99 < rand()) {
                            u.D *= -1;
                        }
                        u.q += u.D;
                        u.q %= heartPointsCount;
                        if (0 > u.q) {
                            u.q += heartPointsCount;
                        }
                    }
                }
                u.vx += -dx / length * u.speed;
                u.vy += -dy / length * u.speed;
                u.trace[0].x += u.vx;
                u.trace[0].y += u.vy;
                u.vx *= u.force;
                u.vy *= u.force;
                for (k = 0; k < u.trace.length - 1;) {
                    var T = u.trace[k];
                    var N = u.trace[++k];
                    N.x -= config.traceK * (N.x - T.x);
                    N.y -= config.traceK * (N.y - T.y);
                }
                ctx.fillStyle = u.f;
                for (k = 0; k < u.trace.length; k++) {
                    ctx.fillRect(u.trace[k].x, u.trace[k].y, 1, 1);
                }
            }
            //ctx.fillStyle = "rgba(255,255,255,1)";
            //for (i = u.trace.length; i--;) ctx.fillRect(targetPoints[i][0], targetPoints[i][1], 2, 2);

            drawFx();
            window.requestAnimationFrame(loop, canvas);
        };

        loop();
    };

    ['top', 'bottom'].forEach(function (id, n) {
        var el = document.getElementById(id);
        Array.from(el.dataset.text).forEach(function (ch, j) {
            var sp = document.createElement('span');
            sp.textContent = ch === ' ' ? '\u00A0' : ch;
            var d = n * 1.5 + j * 0.08;
            sp.style.animationDelay = d + 's, 0s, ' + (d + 0.8) + 's';
            el.appendChild(sp);
        });
    });

    var s = document.readyState;
    if (s === 'complete' || s === 'loaded' || s === 'interactive') init();
    else document.addEventListener('DOMContentLoaded', init, false);
</script>
</BODY>
</HTML>
