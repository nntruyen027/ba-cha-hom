
<HTML>
<HEAD>
    <TITLE> New Document </TITLE>
    <META NAME="Generator" CONTENT="EditPlus">
    <META NAME="Author" CONTENT="">
    <META NAME="Keywords" CONTENT="">
    <META NAME="Description" CONTENT="">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        canvas {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
        }
        #heart { z-index: 1; }
        #fx { z-index: 2; pointer-events: none; }
        .title {
            position: absolute;
            left: 0;
            right: 0;
            z-index: 3;
            text-align: center;
            padding: 0 4vw;
            line-height: 1.25;
            pointer-events: none;
            font-family: 'Dancing Script', cursive;
            font-weight: 700;
        }
        #top { top: max(3vh, env(safe-area-inset-top)); font-size: clamp(22px, min(10vw, 9vh), 96px); }
        #bottom { bottom: max(3vh, env(safe-area-inset-bottom)); font-size: clamp(20px, min(8vw, 7vh), 80px); }
        .title .w { display: inline-block; white-space: nowrap; }
        @media (max-height: 450px) and (orientation: landscape) {
            #top { top: 1vh; }
            #bottom { bottom: 1vh; }
        }
        .title .ch {
            display: inline-block;
            opacity: 0;
            background: linear-gradient(90deg, #ff4d6d, #ffb3c6, #ffd166, #ff8fab, #ff4d6d);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(255, 77, 109, .85));
            animation: pop .8s ease-out forwards, shine 4s linear infinite, wave 2.4s ease-in-out infinite;
        }
        @keyframes pop {
            0% { opacity: 0; transform: translateY(-40px) scale(.3) rotate(-20deg); }
            70% { opacity: 1; transform: translateY(6px) scale(1.2); }
            100% { opacity: 1; transform: none; }
        }
        @keyframes shine { to { background-position: 300% 0; } }
        @keyframes wave {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</HEAD>

<BODY style=" background-color: #000;">

<canvas id="heart"></canvas>
<canvas id="fx"></canvas>
<div id="top" class="title" data-text="Chúc Bà Chã Hơm"></div>
<div id="bottom" class="title" data-text="20/11 Hạnh Phúc Bên Ăm Chã Húi Nhé!!!"></div>

<script>
    window.requestAnimationFrame =
            window.__requestAnimationFrame ||
            window.requestAnimationFrame ||
            window.webkitRequestAnimationFrame ||
            window.mozRequestAnimationFrame ||
            window.oRequestAnimationFrame ||
            window.msRequestAnimationFrame ||
            (function () {
                return function (callback, element) {
                    var lastTime = element.__lastTime;
                    if (lastTime === undefined) {
                        lastTime = 0;
                    }
                    var currTime = Date.now();
                    var timeToCall = Math.max(1, 33 - (currTime - lastTime));
                    window.setTimeout(callback, timeToCall);
                    element.__lastTime = currTime + timeToCall;
                };
            })();
    window.isDevice = (/android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(((navigator.userAgent || navigator.vendor || window.opera)).toLowerCase()));
    var loaded = false;
    var init = function () {
        if (loaded) return;
        loaded = true;
        var mobile = window.isDevice || Math.min(innerWidth, innerHeight) < 600 || matchMedia('(pointer: coarse)').matches;
        // render at device resolution so the heart stays sharp on retina phones
        var koef = Math.min(window.devicePixelRatio || 1, 2);
        var canvas = document.getElementById('heart');
        var ctx = canvas.getContext('2d');
        var width, height;
        var rand = Math.random;
        var i;
        var P = {length: mobile ? 1200 : 2000, duration: 2, velocity: 100, effect: -1.3, size: 13};

        var pointOnHeart = function (t) {
            return [
                160 * Math.pow(Math.sin(t), 3),
                130 * Math.cos(t) - 50 * Math.cos(2 * t) - 20 * Math.cos(3 * t) - 10 * Math.cos(4 * t) + 25
            ];
        };

        var heartScale = 1, heartCX = 0, heartCY = 0;
        var image = document.createElement('canvas');
        var buildHeart = function () {
            width = canvas.width = koef * innerWidth;
            height = canvas.height = koef * innerHeight;
            // fit the effect (~500x500 units incl. particle drift) between the two titles
            var gapTop = document.getElementById('top').getBoundingClientRect().bottom * koef;
            var gapBot = document.getElementById('bottom').getBoundingClientRect().top * koef;
            var fits = gapBot - gapTop > height * 0.4;
            heartCX = width / 2;
            heartCY = fits ? (gapTop + gapBot) / 2 : height / 2;
            heartScale = Math.min(width, fits ? gapBot - gapTop : height * 0.6) / 500;

            var size = Math.max(4, Math.round(P.size * heartScale * 1.2));
            image.width = image.height = size;
            var c = image.getContext('2d');
            c.beginPath();
            for (var t = -Math.PI; t < Math.PI; t += 0.01) {
                var pt = pointOnHeart(t);
                c.lineTo(size / 2 + pt[0] * size / 350, size / 2 - pt[1] * size / 350);
            }
            c.closePath();
            c.fillStyle = '#FF5CA4';
            c.fill();
        };
        buildHeart();
        if (document.fonts) document.fonts.ready.then(buildHeart);

        window.addEventListener('resize', function () {
            buildHeart();
            resizeFx();
        });

        var parts = [];
        for (i = 0; i < P.length; i++) parts.push({x: 0, y: 0, vx: 0, vy: 0, ax: 0, ay: 0, age: P.duration});
        var nextFree = 0;
        var addParticle = function () {
            var pt = pointOnHeart(Math.PI - 2 * Math.PI * rand());
            var len = Math.sqrt(pt[0] * pt[0] + pt[1] * pt[1]) || 1;
            var dx = pt[0] / len * P.velocity, dy = -pt[1] / len * P.velocity;
            var o = parts[nextFree];
            nextFree = (nextFree + 1) % P.length;
            o.x = pt[0];
            o.y = -pt[1];
            o.vx = dx;
            o.vy = dy;
            o.ax = dx * P.effect;
            o.ay = dy * P.effect;
            o.age = 0;
        };

        // heartbeat: 1 -> 0.8 -> 1.2 -> 1 every 1.3s
        var beat = function (t) {
            var k = (t % 1.3) / 1.3;
            if (k < 0.3) return 1 - 0.2 * (k / 0.3);
            if (k < 0.6) return 0.8 + 0.4 * ((k - 0.3) / 0.3);
            return 1.2 - 0.2 * ((k - 0.6) / 0.4);
        };


        var fx = document.getElementById('fx');
        var fctx = fx.getContext('2d');
        var fw, fh, fs;
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var resizeFx = function () {
            fw = innerWidth;
            fh = innerHeight;
            fx.width = fw * dpr;
            fx.height = fh * dpr;
            fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            fs = Math.max(0.6, Math.min(1.4, Math.min(fw, fh) / 700));
        };
        resizeFx();
        var colors = ['#ff4d6d', '#ff8fab', '#ffb3c6', '#ffd166', '#ff006e'];
        var pick = function (a) { return a[~~(rand() * a.length)]; };
        var stars = [];
        for (i = 0; i < (mobile ? 60 : 140); i++) stars.push({x: rand(), y: rand(), r: rand() * 1.4 + 0.3, p: rand() * 6.28, s: rand() * 2 + 0.5});
        var floaters = [], petals = [], bursts = [], shooting = null;

        var drawHeart = function (x, y, size, color, alpha, rot) {
            fctx.save();
            fctx.translate(x, y);
            fctx.rotate(rot);
            fctx.scale(size / 16, size / 16);
            fctx.globalAlpha = Math.max(0, alpha);
            fctx.fillStyle = color;
            fctx.shadowColor = color;
            fctx.shadowBlur = 12;
            fctx.beginPath();
            fctx.moveTo(0, 6);
            fctx.bezierCurveTo(-10, -2, -6, -12, 0, -5);
            fctx.bezierCurveTo(6, -12, 10, -2, 0, 6);
            fctx.fill();
            fctx.restore();
        };

        var burst = function (x, y) {
            for (var j = 0; j < 24; j++) {
                var a = j / 24 * Math.PI * 2, sp = (2 + rand() * 4) * fs;
                bursts.push({x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size: (6 + rand() * 10) * fs, c: pick(colors), life: 1, rot: rand() * 6.28});
            }
        };
        window.addEventListener('pointerdown', function (ev) { burst(ev.clientX, ev.clientY); });
        setInterval(function () {
            if (fh > fw) burst(fw * (0.2 + rand() * 0.6), fh * (rand() < 0.5 ? 0.2 : 0.8));
            else burst(fw * (rand() < 0.5 ? 0.12 + rand() * 0.15 : 0.73 + rand() * 0.15), fh * (0.25 + rand() * 0.5));
        }, 2500);

        var drawFx = function () {
            var t = performance.now() / 1000;
            var j, p;
            fctx.clearRect(0, 0, fw, fh);

            fctx.fillStyle = '#fff';
            for (j = 0; j < stars.length; j++) {
                p = stars[j];
                fctx.globalAlpha = 0.25 + 0.75 * Math.abs(Math.sin(t * p.s + p.p));
                fctx.beginPath();
                fctx.arc(p.x * fw, p.y * fh, p.r, 0, 6.28);
                fctx.fill();
            }
            fctx.globalAlpha = 1;

            if (!shooting && rand() < 0.004) shooting = {x: fw * (0.4 + rand() * 0.6), y: rand() * fh * 0.3, vx: -9, vy: 4.5, life: 1};
            if (shooting) {
                var g = fctx.createLinearGradient(shooting.x, shooting.y, shooting.x - shooting.vx * 14, shooting.y - shooting.vy * 14);
                g.addColorStop(0, 'rgba(255,255,255,' + shooting.life + ')');
                g.addColorStop(1, 'rgba(255,255,255,0)');
                fctx.strokeStyle = g;
                fctx.lineWidth = 2;
                fctx.beginPath();
                fctx.moveTo(shooting.x, shooting.y);
                fctx.lineTo(shooting.x - shooting.vx * 14, shooting.y - shooting.vy * 14);
                fctx.stroke();
                shooting.x += shooting.vx;
                shooting.y += shooting.vy;
                shooting.life -= 0.015;
                if (shooting.life <= 0) shooting = null;
            }

            if (rand() < (mobile ? 0.03 : 0.06)) floaters.push({x: rand() * fw, y: fh + 20, size: (8 + rand() * 18) * fs, vy: (0.5 + rand()) * fs, sway: rand() * 6.28, c: pick(colors)});
            for (j = floaters.length; j--;) {
                p = floaters[j];
                p.y -= p.vy;
                drawHeart(p.x + Math.sin(t * 1.5 + p.sway) * 20 * fs, p.y, p.size, p.c, Math.min(0.8, p.y / fh), Math.sin(t + p.sway) * 0.3);
                if (p.y < -30) floaters.splice(j, 1);
            }

            if (rand() < (mobile ? 0.03 : 0.05)) petals.push({x: rand() * fw, y: -20, vx: rand() - 0.5, vy: 0.6 + rand(), rot: rand() * 6.28, vr: (rand() - 0.5) * 0.06, size: (5 + rand() * 6) * fs, c: rand() < 0.5 ? '#ffc2d1' : '#ffe5ec'});
            for (j = petals.length; j--;) {
                p = petals[j];
                p.x += p.vx + Math.sin(t + j) * 0.5;
                p.y += p.vy;
                p.rot += p.vr;
                fctx.save();
                fctx.translate(p.x, p.y);
                fctx.rotate(p.rot);
                fctx.globalAlpha = 0.85;
                fctx.fillStyle = p.c;
                fctx.beginPath();
                fctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, 6.28);
                fctx.fill();
                fctx.restore();
                if (p.y > fh + 20) petals.splice(j, 1);
            }

            for (j = bursts.length; j--;) {
                p = bursts[j];
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.98;
                p.vy = p.vy * 0.98 + 0.06;
                p.life -= 0.012;
                drawHeart(p.x, p.y, p.size, p.c, p.life, p.rot);
                if (p.life <= 0) bursts.splice(j, 1);
            }
        };

        var lastTime = 0;
        var loop = function () {
            var now = performance.now() / 1000;
            // clamp so a backgrounded tab doesn't make particles jump
            var dt = lastTime ? Math.min(now - lastTime, 0.1) : 0;
            lastTime = now;

            var amount = P.length / P.duration * dt;
            for (i = 0; i < amount; i++) addParticle();

            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.clearRect(0, 0, width, height);
            var b = heartScale * beat(now);
            ctx.setTransform(b, 0, 0, b, heartCX, heartCY);
            for (i = 0; i < P.length; i++) {
                var o = parts[i];
                if (o.age >= P.duration) continue;
                o.x += o.vx * dt;
                o.y += o.vy * dt;
                o.vx += o.ax * dt;
                o.vy += o.ay * dt;
                o.age += dt;
                var r = o.age / P.duration;
                if (r >= 1) continue;
                var ease = (r - 1) * (r - 1) * (r - 1) + 1;
                var sz = P.size * ease;
                ctx.globalAlpha = 1 - r;
                ctx.drawImage(image, o.x - sz / 2, o.y - sz / 2, sz, sz);
            }
            ctx.globalAlpha = 1;

            drawFx();
            window.requestAnimationFrame(loop, canvas);
        };

        loop();
    };

    ['top', 'bottom'].forEach(function (id, n) {
        var el = document.getElementById(id);
        var j = 0;
        // wrap per word so long text breaks between words, not mid-word
        el.dataset.text.split(' ').forEach(function (word, wi) {
            if (wi) el.appendChild(document.createTextNode(' '));
            var w = document.createElement('span');
            w.className = 'w';
            Array.from(word).forEach(function (ch) {
                var sp = document.createElement('span');
                sp.className = 'ch';
                sp.textContent = ch;
                var d = n * 1.5 + j++ * 0.08;
                sp.style.animationDelay = d + 's, 0s, ' + (d + 0.8) + 's';
                w.appendChild(sp);
            });
            el.appendChild(w);
        });
    });

    var s = document.readyState;
    if (s === 'complete' || s === 'loaded' || s === 'interactive') init();
    else document.addEventListener('DOMContentLoaded', init, false);
</script>
</BODY>
</HTML>
